name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      ZYNCODER_DIR: ${{ github.workspace }}/zyncoder-src
      ZYNTHIAN_TEST_DATA_REPO: ${{ github.workspace }}/zynthian-data-src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Shared libraries needed by the Python bindings, plus what tests/native needs: cmake + gcc and the
      # audio dev libs to build the real native libraries, and jackd2 for a private dummy JACK server.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libjack-jackd2-0 libjack-jackd2-dev jackd2 libasound2-dev liblo-dev xvfb cmake build-essential \
            libsndfile1-dev libsamplerate0-dev librubberband-dev nlohmann-json3-dev \
            python3-lilv liblilv-dev

      # tests/conftest.py imports zyngine, which reads omx_contract.catalog and omx_contract.scale: omx-contract's Python
      # package (python3-omx-contract, omx-contract#28). This runner is Ubuntu, not the Debian the channel serves, so the
      # package is installed from the release tag with the repository's own `make install-python` (the files the .deb
      # ships); the openmixer-tests workflow covers the real package on Debian trixie arm64.
      - uses: actions/checkout@v5
        with:
          repository: Open-Mixer/omx-contract
          ref: v3.20.2
          path: omx-contract-src

      - name: Install omx-contract's Python package (omx_contract)
        run: |
          make -C omx-contract-src install-python DESTDIR= PYTHONDIR="$RUNNER_TEMP/omx-py"
          echo "PYTHONPATH=$RUNNER_TEMP/omx-py${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          PYTHONPATH="$RUNNER_TEMP/omx-py" python -c "import omx_contract.catalog, omx_contract.scale"

      - name: Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          # lilv's Python bindings are not on pip; python3-lilv is a single ctypes module (loads liblilv-0.so, from liblilv-dev),
          # so the distro file works with any Python: copy it into this interpreter's site-packages.
          cp /usr/lib/python3/dist-packages/lilv.py "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/"
          python -c "import lilv; lilv.World()"

      - name: Lint (syntax errors / undefined names)
        run: ruff check .

      # The zyncoder repo is separate; the real router is built from it (TOUCH_ONLY: no wiringPi / I2C).
      - uses: actions/checkout@v5
        with:
          repository: zynthian/zyncoder
          path: zyncoder-src

      # Only the example snapshots of zynthian-data (the repo is large): input for the snapshot conversion tests
      - uses: actions/checkout@v5
        with:
          repository: zynthian/zynthian-data
          path: zynthian-data-src
          sparse-checkout: snapshots
          filter: blob:none

      - name: Build real native libraries (zyncore TOUCH_ONLY, zynseq, zynsmf, zynaudioplayer, zynmixer)
        run: tests/native/build_native.sh "$GITHUB_WORKSPACE/zyncoder-src"

      # Hermetic suite (unit + integration + architecture, native libs faked) plus tests/native, which
      # run the real router on a private `jackd -d dummy` started by the tests themselves.
      - name: Tests
        run: xvfb-run -a python -m pytest -ra
